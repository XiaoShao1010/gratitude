[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gratitude"
version = "0.1.0"
description = "MaixCam-based obstacle detection and spatial interaction"
readme = "README.md"
requires-python = ">=3.7"
dependencies = []

[project.scripts]
gratitude-run = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gratitude*"]
